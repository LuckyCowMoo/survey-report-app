<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <title>Survey Reports</title>
    <meta
      name="description"
      content="Turns a shorthand damp-survey document into a finished report"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Survey Reports" />
    <meta name="theme-color" content="#0d0f12" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("survey-report-theme");
          if (t !== "expressive" && t !== "dark" && t !== "original") t = "dark";
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }

        // Local / LAN only: kill stale PWA caches before modules load.
        // Old SW + new hashed assets = blank dark-gray screen on phones.
        var h = location.hostname;
        var local =
          h === "localhost" ||
          h === "127.0.0.1" ||
          h === "[::1]" ||
          /\.local$/.test(h) ||
          /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[0-1])\.)/.test(h);
        if (!local) return;
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) {
              r.unregister();
            });
          });
        }
        if (window.caches && caches.keys) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) {
              caches.delete(k);
            });
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
